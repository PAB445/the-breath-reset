<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>The Breath Reset — Takeaway cards</title>
  <link rel="stylesheet" href="cards.css">
  <link rel="stylesheet" href="layout.css">
</head>
<body>

<!-- Edit card copy here. Every output (A4 sheets, A6 print files, PNGs, mockups) is built from these two templates. -->

<template id="card-front">
  <article class="card front">
    <header class="f-head">
      <h1>A Little Breath Reset</h1>
      <p class="sub">Two simple breathing practices for everyday life.</p>
    </header>

    <section class="practice energise">
      <div class="p-head">
        <div>
          <h2>Ha&#8209;Ha Breath</h2>
          <p class="for">For when you need a little energy.</p>
        </div>
        <div class="p-tag">
          <svg class="p-art" width="15mm" height="9mm" viewBox="0 0 60 36" aria-hidden="true">
            <path d="M19 30 A11 11 0 0 1 41 30 Z" fill="#efd3c2"/>
            <g fill="none" stroke="#d19073" stroke-width="1.3" stroke-linecap="round">
              <path d="M19 30 A11 11 0 0 1 41 30"/>
              <path d="M6 30 H54"/>
              <path d="M43.42 22.25 L47.75 19.75 M37.75 16.58 L40.25 12.25 M30 14.5 L30 9.5 M22.25 16.58 L19.75 12.25 M16.58 22.25 L12.25 19.75"/>
            </g>
          </svg>
          <p class="p-kicker">Energise</p>
        </div>
      </div>
      <p class="p-label">How to practise</p>
      <ol class="steps">
        <li>Take a comfortable breath in through your nose.</li>
        <li>Exhale with two gentle, audible “ha” sounds through your mouth.</li>
        <li>Repeat for 20–30 seconds, then return to natural breathing.</li>
      </ol>
      <p class="p-label">When to use it</p>
      <p class="when">When you’re feeling sluggish, distracted or need a little boost before starting something.</p>
    </section>

    <section class="practice calm">
      <div class="p-head">
        <div>
          <h2>Extended Exhale</h2>
          <p class="for">For when you want to slow down.</p>
        </div>
        <div class="p-tag">
          <svg class="p-art" width="22mm" height="9mm" viewBox="0 0 88 36" aria-hidden="true">
            <path d="M4 28 C12 28 12 10 20 10 C32 10 32 28 44 28 C52 28 52 10 60 10 C72 10 72 28 84 28 Z" fill="#d9e2da"/>
            <path d="M4 28 C12 28 12 10 20 10 C32 10 32 28 44 28 C52 28 52 10 60 10 C72 10 72 28 84 28" fill="none" stroke="#6f8c84" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <p class="p-kicker">Calm</p>
        </div>
      </div>
      <p class="p-label">How to practise</p>
      <ol class="steps">
        <li>Breathe gently in through your nose for 4 seconds.</li>
        <li>Breathe softly out through your nose for 6 seconds.</li>
        <li>Continue for 1–3 minutes, keeping the breath comfortable.</li>
      </ol>
      <p class="p-label">When to use it</p>
      <p class="when">When you’re feeling stressed, overwhelmed, or winding down before bed.</p>
    </section>

    <p class="f-foot">Breathe gently. Never force the breath. Return to natural breathing if uncomfortable.</p>
  </article>
</template>

<template id="card-back">
  <article class="card back">
    <figure class="b-photo">
      <img src="photo/suraj-facilitating.jpg" alt="Suraj Pabari facilitating a breathwork session">
    </figure>
    <div class="b-body">
      <h2 class="b-name">Suraj Pabari</h2>
      <p class="b-role">Founder, The Breath Reset</p>
      <blockquote class="b-quote">
        <p>“I help people get out of their heads and reconnect with their bodies through breathwork.</p>
        <p>From simple breathing tools for everyday life to deeper guided experiences, my approach is about helping you feel the difference — not just understand it.”</p>
      </blockquote>
      <div class="b-links">
        <span class="b-ig">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.4" y="2.4" width="19.2" height="19.2" rx="5.6" fill="none" stroke="currentColor" stroke-width="1.9"/>
            <circle cx="12" cy="12" r="4.4" fill="none" stroke="currentColor" stroke-width="1.9"/>
            <circle cx="17.5" cy="6.5" r="1.25" fill="currentColor"/>
          </svg>
          @the.breath.reset
        </span>
        <span class="b-web">thebreathreset.com.au</span>
      </div>
    </div>
  </article>
</template>

<script src="render.js"></script>
</body>
</html>
